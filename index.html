<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Aludin - Guru Gen Z</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

/* Container */
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

/* Card utama */
.card {
    display: grid;
    grid-template-columns: 1fr 2fr;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease;
}

/* Sidebar */
.sidebar {
    background: rgba(0,0,0,0.2);
    padding: 30px;
    text-align: center;
}

.profile-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 15px;
}

h1 {
    font-size: 26px;
}

.job {
    font-size: 14px;
    color: #ddd;
    margin-bottom: 20px;
}

/* Main */
.main {
    padding: 30px;
}

.section {
    margin-bottom: 20px;
}

.section h2 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #ffd369;
}

.section p {
    font-size: 14px;
    line-height: 1.6;
}

/* Skill bar */
.skill {
    margin-bottom: 10px;
}

.skill span {
    font-size: 13px;
}

.bar {
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    height: 8px;
}

.fill {
    height: 8px;
    background: #ffd369;
}

/* Button */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #ffd369;
    color: black;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* Animasi */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Responsive */
@media(max-width: 768px){
    .card {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <img src="https://drive.google.com/uc?export=view&id=17ElsIMn8gduxUdp0MtdBZUwt1OEdfVM-" class="profile-img">
            <h1>Aludin</h1>
            <p class="job">Pengajar Informatika</p>

            <a class="btn" href="https://wa.me/085141568210">Chat Saya</a>
        </div>

        <!-- MAIN -->
        <div class="main">

            <div class="section">
                <h2>👨‍🏫 Profil</h2>
                <p>Guru informatika yang kreatif dan adaptif dengan gaya mengajar sederhana, menyenangkan, dan relevan dengan perkembangan teknologi masa kini.</p>
            </div>

            <div class="section">
                <h2>🎓 Pendidikan</h2>
                <p>STIKOM El Rahma Bogor</p>
            </div>

            <div class="section">
                <h2>💻 Keahlian</h2>

                <div class="skill">
                    <span>HTML & Web</span>
                    <div class="bar"><div class="fill" style="width: 80%"></div></div>
                </div>

                <div class="skill">
                    <span>Microsoft Office</span>
                    <div class="bar"><div class="fill" style="width: 85%"></div></div>
                </div>

                <div class="skill">
                    <span>Mengajar IT</span>
                    <div class="bar"><div class="fill" style="width: 90%"></div></div>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
